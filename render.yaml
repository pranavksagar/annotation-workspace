# Render Blueprint: one all-in-one Docker web service (migrations + worker + API + frontend) and a Postgres.
# Free-tier settings; see deploy/RENDER.md. APP_PUBLIC_ORIGIN and TRUSTED_HOSTS are derived from the
# platform URL by deploy/start.sh.
services:
  - type: web
    name: annotation-workspace
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/annotation/health/live
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: annotation-db
          property: connectionString
      - key: ENABLE_OCR_SUGGESTIONS
        value: "true"
      # 512 MB is shared by the API and the worker, and the free database holds 1 GB.
      - key: RENDER_DPI
        value: "150"
      - key: MAX_PAGE_PIXELS
        value: "20000000"
      - key: RENDER_MEMORY_LIMIT_MIB
        value: "400"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MAX_TOTAL_RENDER_BYTES
        value: "268435456"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: WORKER_CONCURRENCY
        value: "1"

databases:
  - name: annotation-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: annotation
    user: annotation
    ipAllowList: []
